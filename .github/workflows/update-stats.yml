name: Update GitHub Profile

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  generate:
    # Avoid a loop when the workflow itself commits the updated README.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update text statistics
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py

      - name: Commit README if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+actions@users.noreply.github.com"
          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile statistics"
            git push
          else
            echo "No README changes detected."
          fi
