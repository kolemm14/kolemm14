
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="230"
     viewBox="0 0 900 230">
<defs>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ff1744"/>
    <stop offset="50%" stop-color="#d50000"/>
    <stop offset="100%" stop-color="#6a0000"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#151515"/>
    <stop offset="100%" stop-color="#090909"/>
  </linearGradient>
</defs>
<rect width="100%" height="100%" rx="18" fill="url(#bg)"/>
<rect x="0" y="0" width="5" height="100%"
      rx="2" fill="url(#red)"/>
<text x="35" y="48" fill="#ffffff"
      font-size="23" font-weight="bold"
      font-family="Arial">GITHUB OVERVIEW</text>

<rect x="35" y="85" width="190" height="105"
      rx="12" fill="#202020"
      stroke="#3a2020"/>
<text x="50" y="120" fill="#999"
      font-size="13" font-family="Arial">REPOSITORIES</text>
<text x="50" y="165" fill="url(#red)"
      font-size="32" font-weight="bold"
      font-family="Arial">7</text>

<rect x="250" y="85" width="190" height="105"
      rx="12" fill="#202020"
      stroke="#3a2020"/>
<text x="265" y="120" fill="#999"
      font-size="13" font-family="Arial">TOTAL STARS</text>
<text x="265" y="165" fill="url(#red)"
      font-size="32" font-weight="bold"
      font-family="Arial">5</text>

<rect x="465" y="85" width="190" height="105"
      rx="12" fill="#202020"
      stroke="#3a2020"/>
<text x="480" y="120" fill="#999"
      font-size="13" font-family="Arial">TOTAL FORKS</text>
<text x="480" y="165" fill="url(#red)"
      font-size="32" font-weight="bold"
      font-family="Arial">0</text>

<rect x="680" y="85" width="190" height="105"
      rx="12" fill="#202020"
      stroke="#3a2020"/>
<text x="695" y="120" fill="#999"
      font-size="13" font-family="Arial">FOLLOWERS</text>
<text x="695" y="165" fill="url(#red)"
      font-size="32" font-weight="bold"
      font-family="Arial">1</text>

</svg>